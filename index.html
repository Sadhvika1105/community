<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Music Mood Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.8)),
                url('https://source.unsplash.com/1600x900/?music,concert');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 0.5s ease;
            color: white;
        }

        body.dark-mode {
            background: linear-gradient(to right, rgba(20, 30, 48, 0.8), rgba(36, 59, 85, 0.8)),
                url('https://source.unsplash.com/1600x900/?music,concert');
            background-size: cover;
            background-position: center;
        }

        .welcome-message {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            z-index: 1000;
            animation: fadeOut 5s forwards;
        }

        @keyframes fadeOut {
            0% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 500px;
            width: 90%;
            transition: background 0.5s ease, color 0.5s ease;
            color: black;
        }

        body.dark-mode .container {
            background: rgba(44, 62, 80, 0.9);
            color: white;
        }

        input[type="text"],
        select {
            padding: 10px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-top: 10px;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #ec6c4c;
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #eb6750;
        }

        .result {
            margin-top: 20px;
        }

        iframe {
            margin-top: 10px;
            border-radius: 10px;
        }

        .dark-mode-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: background 0.3s ease;
        }

        .dark-mode-toggle:hover {
            background: #f0f0f0;
        }
    </style>
</head>

<body>
    <div class="welcome-message" id="welcomeMessage">Welcome to Music Mood Detector!</div>
    <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌙</button>
    <div class="container">
        <h1>🎶 Music Mood Detector</h1>
        <p>Describe how you're feeling or select a mood:</p>

        <input type="text" id="moodInput" placeholder="e.g., I feel happy, relaxed, or sad">
        <br>
        <select id="moodDropdown" onchange="setMoodFromDropdown()">
            <option value="">-- Select a Mood --</option>
            <option value="happy">Happy</option>
            <option value="sad">Sad</option>
            <option value="angry">Angry</option>
            <option value="relaxed">Relaxed</option>
        </select>
        <br>
        <button onclick="detectMood()">Detect Mood</button>
        <button onclick="resetMood()">Reset</button>
        <button onclick="randomMood()">Random Mood</button>

        <div class="result" id="result"></div>
    </div>

    <script>
        // Hide the welcome message after 5 seconds
        setTimeout(() => {
            const welcomeMessage = document.getElementById('welcomeMessage');
            if (welcomeMessage) {
                welcomeMessage.style.display = 'none';
            }
        }, 5000);

        function setMoodFromDropdown() {
            const dropdown = document.getElementById('moodDropdown');
            const input = document.getElementById('moodInput');
            input.value = dropdown.value;
        }

        function detectMood() {
            const input = document.getElementById('moodInput').value.toLowerCase();
            const resultDiv = document.getElementById('result');
            let mood = '';
            let songEmbed = '';

            if (input.includes('happy') || input.includes('excited') || input.includes('joy')) {
                mood = 'Happy 😊';
                songEmbed = `<iframe width="300" height="170" src="https://www.youtube.com/embed/6Xee5AJza2w?si=xdzsHU4Uaz4CloGU" title="YouTube video player" 
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <p>Suggested Song: <strong>Happy Days - Theme Song</strong></p>`;
            } else if (input.includes('sad') || input.includes('down') || input.includes('depressed')) {
                mood = 'Sad 😢';
                songEmbed = `<iframe width="300" height="170" src="https://www.youtube.com/embed/iTAj46KJZtM?si=0Dv1FTgfrYWOslxB" title="YouTube video player" 
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            <iframe width="300" height="170" src="https://www.youtube.com/embed/oSHzUD-uqKY?si=uKLkw99RF8gzch9b" title="YouTube video player" 
            frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <p>Suggested Song: <strong>Mere Yaara - Arijit Singh</strong></p>`;
            } else if (input.includes('angry') || input.includes('mad') || input.includes('furious')) {
                mood = 'Angry 😠';
                songEmbed = `<iframe width="300" height="170" src="https://www.youtube.com/embed/7wtfhZwyrcc" 
          frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          <p>Suggested Song: <strong>Believer - Imagine Dragons</strong></p>`;
            } else if (input.includes('relaxed') || input.includes('calm') || input.includes('peaceful')) {
                mood = 'Relaxed 😌';
                songEmbed = `<iframe width="300" height="170" src="https://www.youtube.com/embed/lz1-1Q8Gync?si=caihjxvwMEehOzUd" title="YouTube video player" 
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <p>Suggested Song: <strong>Love Me Thoda Aur - Arijit Singh</strong></p>`;
            } else {
                mood = 'Neutral 🤔';
                songEmbed = `<iframe width="300" height="170" src="https://www.youtube.com/embed/2Vv-BfVoq4g" 
          frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          <p>Suggested Song: <strong>Perfect - Ed Sheeran</strong></p>`;
            }

            resultDiv.innerHTML = `<h2>Your Mood: ${mood}</h2>${songEmbed}`;
        }

        function resetMood() {
            document.getElementById('moodInput').value = '';
            document.getElementById('moodDropdown').value = '';
            document.getElementById('result').innerHTML = '';
        }

        function randomMood() {
            const moods = ['happy', 'sad', 'angry', 'relaxed'];
            const randomMood = moods[Math.floor(Math.random() * moods.length)];
            document.getElementById('moodInput').value = randomMood;
            detectMood();
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }
    </script>
</body>

</html>
